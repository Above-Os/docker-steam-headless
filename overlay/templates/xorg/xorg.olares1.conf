Section "ServerLayout"
    Identifier     "Default Layout"
    Screen      0  "Default Screen"
EndSection

Section "Monitor"
    Modeline "1920x1080R"  138.50  1920 1968 2000 2080  1080 1083 1088 1111 +hsync -vsync
    Identifier     "Configured Monitor"
    HorizSync       5.0 - 1000.0
    VertRefresh     5.0 - 200.0
EndSection

Section "Device"
    Identifier     "Configured Video Device"
    Driver         "nvidia"
    # NoMaxPClkCheck is deliberately absent: it is the only guard left against
    # programming a mode the head cannot physically scan out. Dropping it lets a
    # client-requested mode wedge the display engine (Xid 16, no vblank, X spins
    # at 100% CPU and never recovers without a reboot).
    Option         "ModeValidation" "NoEdidMaxPClkCheck, NoMaxSizeCheck, NoHorizSyncCheck, NoVertRefreshCheck, NoVirtualSizeCheck, NoTotalSizeCheck, NoDisplayPortBandwidthCheck, AllowNonEdidModes, NoEdidHDMI2Check"
    Option         "AllowEmptyInitialConfiguration"
    Option         "AllowExternalGpus" "True"
    # Force both the HDMI TMDS head (DFP-0) and the internal DisplayPort head
    # (DFP-1). A single-head ConnectedMonitor makes the driver ignore the other
    # output: DFP-1-only leaves a physical HDMI panel dark, DFP-0-only cannot
    # scan out 4K120 for Sunshine. nvidia-output-layout.sh keeps exactly one of
    # HDMI-0 / DP-0 enabled at a time so xfce does not overlap them.
    Option         "ConnectedMonitor" "DFP-0, DFP-1"
    BusID          "PCI:2:0:0"
EndSection

Section "Screen"
    Identifier     "Default Screen"
    Device         "Configured Video Device"
    Monitor        "Configured Monitor"
    DefaultDepth    24
    Option         "ProbeAllGpus" "False"
    Option         "BaseMosaic" "False"
    Option         "AllowEmptyInitialConfiguration" "True"
    SubSection     "Display"
        Virtual     3840 2160
        Depth       24
        Modes       "1920x1080"
    EndSubSection
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection