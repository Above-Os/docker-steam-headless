
[program:nvidia-output-layout]
priority=40
autostart=false
autorestart=true
user=%(ENV_USER)s
directory=/home/%(ENV_USER)s
command=/usr/bin/nvidia-output-layout.sh
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",DISPLAY_SIZEW="%(ENV_DISPLAY_SIZEW)s",DISPLAY_SIZEH="%(ENV_DISPLAY_SIZEH)s",DISPLAY_REFRESH="%(ENV_DISPLAY_REFRESH)s"
stopsignal=INT
stdout_logfile=/home/%(ENV_USER)s/.cache/log/nvidia-output-layout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=7
stderr_logfile=/home/%(ENV_USER)s/.cache/log/nvidia-output-layout.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=7
